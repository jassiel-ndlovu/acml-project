# ---- Data paths ----
data:
  raw: data/raw/Base.csv           # BAF "Base" variant (download from Kaggle)
  split_dir: data/splits           # train.csv / val.csv / test.csv
  processed_dir: data/processed    # X_*.npy, y_*.npy, preprocessor.json
  model_path: outputs/autoencoder_final.pt

# ---- Model ----
model:
  input_dim: 57                    # set by preprocessing (one-hot expands 32 -> 57)
  hidden_dims: [64, 32, 16]
  dropout: 0.1
  threshold: 0.0248                # learnt on validation (max-F1); auto-updated by evaluate.py

# ---- Training ----
training:
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.00001
  num_epochs: 60
  patience: 8                      # early-stopping patience on held-out normal loss

# ---- Performance outputs ----
performance:
  train_path: performance/train
  test_path: performance/test
  fig_path: figures

# ---- Environment ----
seed: 42
